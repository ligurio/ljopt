name: Testing

on:
  push:
  pull_request:

jobs:
  ljopt:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache LuaJIT
        uses: actions/cache@v3
        id: luajit-cache
        with:
          # This path should be same as the path in Makefile,
          # where tarantool's LuaJIT repo stored.
          path: build
          key: ${{ runner.os }}-luajit-${{ hashFiles('lua_patches/*.patch') }}

      - name: Setup packages
        run: sudo apt install -y luarocks

      - name: Setup cvc5
        env:
          # Ubuntu 24.04 ships cvc5 1.1.2, which predates the C API
          # the test backend binds to (added in 1.2.0) and answers
          # some of these formulas incorrectly, so take it upstream.
          CVC5_VERSION: 1.3.4
        run: |
          curl -sSL -o cvc5.zip \
            "https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/cvc5-Linux-x86_64-shared.zip"
          unzip -q cvc5.zip
          echo "LD_LIBRARY_PATH=$PWD/cvc5-Linux-x86_64-shared/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Setup rocks
        run: make deps

      - name: Building
        run: make build

      - name: Testing
        env:
          LJOPT_ENABLE_INTERNAL_CHECKS: 1
          LJOPT_STRICT: 1
          LJOPT_TESTS_TIMEOUT: 120
        run: |
          eval $(luarocks path)
          make test

      - name: Testing with code coverage
        env:
          LJOPT_ENABLE_INTERNAL_CHECKS: 1
          LJOPT_STRICT: 1
          LJOPT_TESTS_TIMEOUT: 120
        run: |
          eval $(luarocks path)
          make coverage

  # Translate smtlib_ir_coverage.lua with the Lua SMT-LIB API and
  # check that the emitted SMT-LIB parses in a solver backend.  The
  # backend is selected with the LJOPT_SMT environment variable, so a
  # new backend only needs a new matrix entry (and a setup step).
  smt-backends:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [cvc5, z3]

    steps:
      - uses: actions/checkout@v4

      - name: Cache LuaJIT
        uses: actions/cache@v3
        id: luajit-cache
        with:
          path: build
          key: ${{ runner.os }}-luajit-${{ hashFiles('lua_patches/*.patch') }}

      - name: Setup packages
        run: sudo apt install -y luarocks

      - name: Setup Z3 (library)
        if: matrix.backend == 'z3'
        uses: cda-tum/setup-z3@v1
        with:
          # Equivalence of some traces could not be proved
          # on earlier versions.
          version: 4.16.0
          add_to_library_path: true

      - name: Setup cvc5
        if: matrix.backend == 'cvc5'
        env:
          # Ubuntu 24.04 ships cvc5 1.1.2, which predates the C API
          # the test backend binds to (added in 1.2.0) and answers
          # some of these formulas incorrectly, so take it upstream.
          CVC5_VERSION: 1.3.4
        run: |
          curl -sSL -o cvc5.zip \
            "https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/cvc5-Linux-x86_64-shared.zip"
          unzip -q cvc5.zip
          echo "LD_LIBRARY_PATH=$PWD/cvc5-Linux-x86_64-shared/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Setup rocks
        run: make deps

      - name: Building
        run: make build

      - name: Testing ${{ matrix.backend }} backend
        env:
          LJOPT_SMT: ${{ matrix.backend }}
          LJOPT_ENABLE_INTERNAL_CHECKS: 1
          LJOPT_STRICT: 1
        run: |
          eval $(luarocks path)
          make test-smt-backend
